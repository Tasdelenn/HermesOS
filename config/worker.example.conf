worker_id=windows-development-01
role=development
capabilities=system.info
brain_url=ws://127.0.0.1:9000
# registration_token=  # single-use token for the FIRST start only (enrollment)
# state_file=config/worker.state.json  # optional: where the credential issued at
#                                      # enrollment is stored (default: <config>.state.json
#                                      # next to this file; git-ignored, keep private)
# heartbeat_interval_secs=30  # optional: defaults to 30